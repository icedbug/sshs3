name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Start Windows OpenSSH Agent
        if: runner.os == 'Windows'
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Tests
        if: runner.os != 'Linux'
        run: npm run test

      - name: Run Tests with coverage thresholds
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Headless Smoke Test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
