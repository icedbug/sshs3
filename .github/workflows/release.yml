name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      publish:
        description: 'Publish the GitHub release. Untick to only build and keep the files as workflow artifacts (for testing).'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-24.04
            target: linux
          - name: Windows
            os: windows-latest
            target: win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Start Windows OpenSSH Agent
        if: runner.os == 'Windows'
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent

      - name: Install dependencies
        run: npm ci

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Prepare bundled age + age-plugin-yubikey for Team Vault (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p build-resources/age/linux

          echo "Downloading age v1.3.2 (linux-amd64)..."
          curl -sL -o age.tar.gz "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz" | sha256sum -c -
          tar xzf age.tar.gz
          cp age/age build-resources/age/linux/age
          rm -rf age age.tar.gz

          # Pinned to v0.5.0, not "latest": v0.5.1 dropped the Linux binary from its release
          # assets entirely (darwin + windows only) — verified against the project's GitHub
          # Releases API when this step was written. v0.5.0 is the newest release that still
          # ships Linux and Windows binaries together, so both platforms stay on one version.
          echo "Downloading age-plugin-yubikey v0.5.0 (x86_64-linux)..."
          curl -sL -o apy.tar.gz "https://github.com/str4d/age-plugin-yubikey/releases/download/v0.5.0/age-plugin-yubikey-v0.5.0-x86_64-linux.tar.gz"
          echo "019b35a13fc81be56d73d0723db0a2082fbd04c936c2c6836381111f7f51b2c3  apy.tar.gz" | sha256sum -c -
          tar xzf apy.tar.gz
          cp age-plugin-yubikey/age-plugin-yubikey build-resources/age/linux/age-plugin-yubikey
          rm -rf age-plugin-yubikey apy.tar.gz

          chmod +x build-resources/age/linux/age build-resources/age/linux/age-plugin-yubikey

      - name: Prepare bundled age + age-plugin-yubikey for Team Vault (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/age/win'

          Write-Host "Downloading age v1.3.2 (windows-amd64)..."
          Invoke-WebRequest -Uri "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip" -OutFile "age.zip"
          $expectedAge = "f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7"
          $actualAge = (Get-FileHash -Algorithm SHA256 "age.zip").Hash.ToLower()
          if ($actualAge -ne $expectedAge) { throw "age.zip checksum mismatch: $actualAge" }
          Expand-Archive -Path "age.zip" -DestinationPath "age-extract" -Force
          Copy-Item "age-extract/age/age.exe" "build-resources/age/win/age.exe"
          Remove-Item -Recurse -Force "age-extract", "age.zip"

          # Pinned to v0.5.0 for the same reason as the Linux step above (see its comment):
          # v0.5.1 dropped the Linux asset, so both platforms are kept on the last release that
          # shipped both.
          Write-Host "Downloading age-plugin-yubikey v0.5.0 (x86_64-windows)..."
          Invoke-WebRequest -Uri "https://github.com/str4d/age-plugin-yubikey/releases/download/v0.5.0/age-plugin-yubikey-v0.5.0-x86_64-windows.zip" -OutFile "apy.zip"
          $expectedApy = "a2f1478bc691328861e9e511dfc498ddedb1d0b4b2e93c002f14ce1db0cb5abf"
          $actualApy = (Get-FileHash -Algorithm SHA256 "apy.zip").Hash.ToLower()
          if ($actualApy -ne $expectedApy) { throw "apy.zip checksum mismatch: $actualApy" }
          Expand-Archive -Path "apy.zip" -DestinationPath "apy-extract" -Force
          Copy-Item "apy-extract/age-plugin-yubikey/age-plugin-yubikey.exe" "build-resources/age/win/age-plugin-yubikey.exe"
          Remove-Item -Recurse -Force "apy-extract", "apy.zip"

      - name: Prepare bundled VcXsrv for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/vcxsrv'
          Write-Host "Downloading VcXsrv 21.1.16.1 installer..."
          Invoke-WebRequest -Uri "https://github.com/marchaesen/vcxsrv/releases/download/21.1.16.1/vcxsrv-64.21.1.16.1.installer.exe" -OutFile "vcxsrv-installer.exe"
          # Pin the bundled third-party installer: fail the build if it changes upstream.
          $expected = "df7fed8f49665d0592528ab6be9d07111ea73c6848283d128b77690e05b8f90b"
          $actual = (Get-FileHash -Algorithm SHA256 "vcxsrv-installer.exe").Hash.ToLower()
          if ($actual -ne $expected) { throw "VcXsrv installer checksum mismatch: $actual" }
          Write-Host "Extracting VcXsrv with 7z..."
          7z x vcxsrv-installer.exe -o"build-resources/vcxsrv" -y
          if (Test-Path 'build-resources/vcxsrv/$PLUGINSDIR') {
            Remove-Item -Recurse -Force 'build-resources/vcxsrv/$PLUGINSDIR'
          }
          Remove-Item -Force "vcxsrv-installer.exe" -ErrorAction SilentlyContinue
          Write-Host "VcXsrv bundled successfully. Extracted files:"
          Get-ChildItem -Path 'build-resources/vcxsrv' | Select-Object -First 10 Name

      - name: Build application bundles
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package policy templates (ADMX/ADML and policy.conf example)
        if: runner.os == 'Linux'
        run: |
          version="$(node -p "require('./package.json').version")"
          stage="sshs3-policy-templates-${version}"
          mkdir -p "$stage/en-US" release
          cp packaging/windows/policy/sshs3.admx "$stage/"
          cp packaging/windows/policy/en-US/sshs3.adml "$stage/en-US/"
          cp packaging/policy.conf.example "$stage/"
          zip -r "release/${stage}.zip" "$stage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List collected release files
        run: |
          echo "=== Release artifacts ==="
          ls -lh dist-artifacts

      - name: Determine Release Tag
        id: get_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256SUMS
        working-directory: dist-artifacts
        run: sha256sum *.AppImage *.deb *.rpm *.exe *.msi *.zip > SHA256SUMS

      - name: Setup Node.js (for SBOM)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate SBOM (CycloneDX)
        run: npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --ignore-npm-errors --output-file dist-artifacts/sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.exe
            dist-artifacts/*.msi
            dist-artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.exe
            dist-artifacts/*.msi
            dist-artifacts/*.zip
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml
            dist-artifacts/SHA256SUMS
            dist-artifacts/sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
