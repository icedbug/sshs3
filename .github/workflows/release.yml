name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-24.04
            target: linux
          - name: Windows
            os: windows-latest
            target: win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Start Windows OpenSSH Agent
        if: runner.os == 'Windows'
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent

      - name: Install dependencies
        run: npm ci

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Prepare bundled VcXsrv for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/vcxsrv'
          Write-Host "Downloading VcXsrv 21.1.16.1 installer..."
          Invoke-WebRequest -Uri "https://github.com/marchaesen/vcxsrv/releases/download/21.1.16.1/vcxsrv-64.21.1.16.1.installer.exe" -OutFile "vcxsrv-installer.exe"
          # Pin the bundled third-party installer: fail the build if it changes upstream.
          $expected = "df7fed8f49665d0592528ab6be9d07111ea73c6848283d128b77690e05b8f90b"
          $actual = (Get-FileHash -Algorithm SHA256 "vcxsrv-installer.exe").Hash.ToLower()
          if ($actual -ne $expected) { throw "VcXsrv installer checksum mismatch: $actual" }
          Write-Host "Extracting VcXsrv with 7z..."
          7z x vcxsrv-installer.exe -o"build-resources/vcxsrv" -y
          if (Test-Path 'build-resources/vcxsrv/$PLUGINSDIR') {
            Remove-Item -Recurse -Force 'build-resources/vcxsrv/$PLUGINSDIR'
          }
          Remove-Item -Force "vcxsrv-installer.exe" -ErrorAction SilentlyContinue
          Write-Host "VcXsrv bundled successfully. Extracted files:"
          Get-ChildItem -Path 'build-resources/vcxsrv' | Select-Object -First 10 Name

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The Hermes agent ships inside the installers (electron-builder extraResources). The script
      # pins the Hermes release by tag and commit and installs its Python dependencies by hash.
      - name: Build bundled Hermes agent runtime
        run: node scripts/hermes/build-runtime.mjs

      - name: Build application bundles
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List collected release files
        run: |
          echo "=== Release artifacts ==="
          ls -lh dist-artifacts

      - name: Determine Release Tag
        id: get_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256SUMS
        working-directory: dist-artifacts
        run: sha256sum *.AppImage *.deb *.rpm *.exe *.zip > SHA256SUMS

      - name: Setup Node.js (for SBOM)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate SBOM (CycloneDX)
        run: npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --ignore-npm-errors --output-file dist-artifacts/sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.exe
            dist-artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml
            dist-artifacts/SHA256SUMS
            dist-artifacts/sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
