name: Security

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 5 * * 1'   # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  audit:
    name: npm audit + Trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: npm audit
        run: node scripts/npm-audit-gate.mjs
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,dist,dist-electron,release

  sast-and-secrets:
    name: Semgrep + detect-secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install semgrep detect-secrets
      - name: Semgrep (vendored rules, offline)
        run: semgrep scan --config .semgrep/rules/ --error --quiet --metrics=off --disable-version-check src scripts
      - name: detect-secrets
        run: |
          git ls-files -z | grep -zv 'package-lock.json' | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  # CodeQL runs via the repository's GitHub "default setup" (an advanced workflow can't coexist with it).
