name: AI Hub integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/ai/**'
      - 'src/main/desktopEntry.ts'
      - 'src/main/index.ts'
      - 'src/main/IpcBridge.ts'
      - 'src/renderer/**'
      - 'src/preload/**'
      - 'src/shared/types/**'
      - 'tests/**/aiHub*'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/ai-hub.yml'
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux shells and build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish build-essential libx11-dev libxi-dev libportaudio2
      - name: Install sshs3 locked dependencies
        run: npm ci
      - name: Actual Windows or Linux PTY shell matrix
        run: npx vitest run tests/main/aiHub.shell.integration.test.ts
        env:
          SSHS3_SHELL_INTEGRATION: '1'
      - name: Existing terminal broker and storage regressions
        run: npx vitest run tests/main/aiHub.test.ts tests/main/aiHub.files.test.ts tests/main/aiHub.config.test.ts tests/main/aiHub.lifecycle.test.ts tests/renderer/aiHub.test.tsx
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
