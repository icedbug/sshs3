# The shop's workloads on the lab's Kubernetes cluster, applied to the namespace a task names.
# Images are loaded into the cluster by the lab (k8sUp), so nothing is pulled when a task runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-web
data:
  index.html: |
    <html><head><title>Shop</title></head><body><h1>Shop</h1></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  labels: { app: shop-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop-web }
  template:
    metadata:
      labels: { app: shop-web }
    spec:
      containers:
        - name: web
          image: docker.io/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
      volumes:
        - name: html
          configMap: { name: shop-web }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
spec:
  selector: { app: shop-web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  labels: { app: shop-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop-worker }
  template:
    metadata:
      labels: { app: shop-worker }
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'while true; do echo "worker: processed a batch of orders"; sleep 10; done']
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
